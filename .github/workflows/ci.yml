name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install "jsonschema>=4.23,<5" "mypy>=1.17,<2" "pre-commit>=3.6,<5" "pytest>=8.4,<10" "pytest-xdist>=3.8,<4" "pyyaml>=6,<7" "ruff>=0.12,<0.16"
      # Pinned so a CLI release can't change the validator under us; bump it with the local version.
      - run: npm install -g @anthropic-ai/claude-code@2.1.322
      - run: make check
