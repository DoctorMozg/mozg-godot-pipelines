schema_version: "1.1"
name: balance-negative-1
description: "Near-miss: reference research belongs to gd-research."
tags: [gd-balance, negative]
runs: 3
execution:
  prompt: >-
    Find out what resource rates and crafting costs games like Oxygen Not Included use, with sources for each.
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Skill]
graders:
  - name: skill-silent
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?gd-balance"'
    min: 0
    max: 0
    arm: both
  - name: owner-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?gd-research"'
