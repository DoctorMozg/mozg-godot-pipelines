schema_version: "1.1"
name: balance-positive-2
description: "Indirect: initial quantities and a stale copy."
tags: [gd-balance, positive]
runs: 3
execution:
  prompt: >-
    Figure out initial resource quantities for scrap and oxygen yourself, and make sure survival.tres matches the design numbers.
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?gd-balance"'
