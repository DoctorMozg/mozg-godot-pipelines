schema_version: "1.1"
name: canon-positive-1
description: "Literal: which design doc wins."
tags: [gd-canon, positive]
runs: 3
execution:
  prompt: >-
    The balance doc and the campaign rules doc disagree about the oxygen schedule. Which design document should win for this topic in my game?
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?gd-canon"'
