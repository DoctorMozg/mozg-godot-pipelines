schema_version: "1.1"
name: interview-positive-2
description: "Indirect: an answer batch that replaces an older rule."
tags: [gd-interview, positive]
runs: 3
execution:
  prompt: >-
    1 - Yes 2 - Magnetic slots instead of the two-hour breathing rule 3 - Defer. Write these down properly so the old breathing rule is replaced, not lost.
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?gd-interview"'
