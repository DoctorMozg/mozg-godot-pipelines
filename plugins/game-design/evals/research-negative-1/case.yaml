schema_version: "1.1"
name: research-negative-1
description: "Near-miss: tuning this game's run length belongs to gd-balance."
tags: [gd-research, negative]
runs: 3
execution:
  prompt: >-
    Our campaign simulates at 9 hours but the target is 7-8. Tune the oxygen and food numbers until it fits.
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Skill]
graders:
  - name: skill-silent
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?gd-research"'
    min: 0
    max: 0
    arm: both
  - name: owner-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?gd-balance"'
