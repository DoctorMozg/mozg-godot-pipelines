schema_version: "1.1"
name: research-positive-1
description: "Literal: research reference games for a mechanic."
tags: [gd-research, positive]
runs: 3
execution:
  prompt: >-
    Research how other survival games handle oxygen and food pacing, with sources, so we can decide our own rules.
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?gd-research"'
