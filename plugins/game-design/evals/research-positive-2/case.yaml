schema_version: "1.1"
name: research-positive-2
description: "Indirect: how other games solved a design problem."
tags: [gd-research, positive]
runs: 3
execution:
  prompt: >-
    What did games like RimWorld and Frostpunk do to keep the late game from feeling like a solved routine? I want evidence I can cite.
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?gd-research"'
