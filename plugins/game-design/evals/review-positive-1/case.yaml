schema_version: "1.1"
name: review-positive-1
description: "Literal: is the GDD complete."
tags: [gd-review, positive]
runs: 3
execution:
  prompt: >-
    So is the GDD finished? Review all of our game design data and tell me what it still lacks.
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?gd-review"'
