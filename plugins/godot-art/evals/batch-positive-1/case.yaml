schema_version: "1.1"
name: batch-positive-1
description: "Literal: generate pictures from ready briefs."
tags: [art-batch, positive]
runs: 3
execution:
  prompt: >-
    All the unit portrait briefs in my Godot project are approved and lint clean. Generate them on fal now, register each file with its cost and check them with the judges.
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?art-batch"'
