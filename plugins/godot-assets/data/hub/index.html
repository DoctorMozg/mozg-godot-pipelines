<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Asset review</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="app.css">
  </head>
  <body>
    <div class="top">
    <header class="bar">
      <h1>Asset review</h1>
      <input id="search" type="search" placeholder="Search title or id" aria-label="Search">
      <label>Family <select id="family"></select></label>
      <label>Status
        <select id="filter">
          <option value="">all</option>
          <option value="pending_review">pending_review</option>
          <option value="retake">retake</option>
          <option value="approved">approved</option>
          <option value="final">final</option>
          <option value="rejected">rejected</option>
          <option value="deprecated">deprecated</option>
          <option value="draft">draft</option>
        </select>
      </label>
      <span id="connection" class="connection" data-state="connecting">connecting</span>
    </header>
    <div id="bulk" class="bulk" hidden>
      <label><input id="select-shown" type="checkbox"> <span id="shown-count"></span></label>
      <span id="selected-count" class="meta"></span>
      <button type="button" class="btn approve" data-bulk="approve">Approve selected</button>
      <button type="button" class="btn retake" data-bulk="retake">Retake selected…</button>
      <button type="button" class="btn reject" data-bulk="reject">Reject selected</button>
      <button type="button" class="btn" data-bulk="clear">Clear selection</button>
      <span id="progress" class="meta" role="status"></span>
      <div id="bulk-panel" class="bulk-panel" hidden>
        <p id="bulk-question"></p>
        <textarea id="bulk-hint" rows="2" placeholder="What should change compared to their current takes? Leave empty to just draw them again."></textarea>
        <div class="row">
          <button id="bulk-go" type="button" class="btn primary"></button>
          <button id="bulk-cancel" type="button" class="btn">Cancel</button>
        </div>
      </div>
    </div>
    <p id="message" class="message" role="status" hidden></p>
    </div>
    <main id="grid" class="grid" aria-live="polite"></main>
    <section id="strings" class="strings" hidden>
      <h2>Strings</h2>
      <label>Locale <select id="string-locale"></select></label>
      <label>State
        <select id="string-state">
          <option value="">all</option>
          <option>machine</option>
          <option>translated</option>
          <option>reviewed</option>
          <option>stale</option>
        </select>
      </label>
      <table>
        <thead><tr><th>Key</th><th>Source</th><th>Translation</th><th>State</th><th>Screenshots</th><th></th></tr></thead>
        <tbody id="string-rows"></tbody>
      </table>
    </section>
    <section id="findings" class="strings findings" hidden>
      <h2>Playtest findings</h2>
      <label>Status
        <select id="finding-status">
          <option value="">all</option>
          <option>open</option>
          <option>accepted</option>
          <option>dismissed</option>
          <option>rerun</option>
        </select>
      </label>
      <table>
        <thead><tr><th>Finding</th><th>Evidence</th><th>Class</th><th>Status</th><th></th></tr></thead>
        <tbody id="finding-rows"></tbody>
      </table>
    </section>
    <script src="items.js"></script>
    <script src="viewers.js"></script>
    <script src="strings.js"></script>
    <script src="findings.js"></script>
    <script src="bulk.js"></script>
    <script src="app.js"></script>
  </body>
</html>
