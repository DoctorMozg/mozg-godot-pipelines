schema_version: "1.1"
name: hub-negative-1
description: "Near-miss: placing an approved file in res:// belongs to asset-registry."
tags: [review-hub, negative]
runs: 3
execution:
  prompt: >-
    The cargo door texture was approved yesterday. Put it into my Godot project at res://art/props/door.png so the scenes can use it.
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Skill]
graders:
  - name: skill-silent
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?review-hub"'
    min: 0
    max: 0
    arm: both
  - name: owner-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?asset-registry"'
