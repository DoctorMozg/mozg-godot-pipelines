schema_version: "1.1"
name: registry-positive-1
description: "Literal: record a freshly generated texture with its provenance."
tags: [asset-registry, positive]
runs: 3
execution:
  prompt: >-
    I just generated a new cargo door texture for my Godot game with fal (nano-banana, seed 42) and saved it in the staging folder. Record it in the project's asset registry with where it came from.
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?asset-registry"'
