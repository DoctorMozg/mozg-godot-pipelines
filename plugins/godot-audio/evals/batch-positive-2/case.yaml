schema_version: "1.1"
name: batch-positive-2
description: "Indirect: retake a game sound the owner rejected after listening."
tags: [audio-batch, positive]
runs: 3
execution:
  prompt: >-
    I listened to the footstep sound candidates for my Godot game and they are too boomy. Make new takes of the footstep cue with a drier prompt and stage them as new versions next to the old ones.
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?audio-batch"'
