schema_version: "1.1"
name: cues-positive-1
description: "Literal: check the bus layout and the loops of a cue sheet."
tags: [audio-cues, positive]
runs: 3
execution:
  prompt: >-
    My Godot game has an audio/cues.json cue sheet. Lint it, check that the bus layout ends with a limiter on Master and that no scene plays on a misspelled bus, and check the loop seams of the music cues.
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?audio-cues"'
