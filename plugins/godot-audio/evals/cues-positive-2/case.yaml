schema_version: "1.1"
name: cues-positive-2
description: "Indirect: plan the sounds of a game and make simple UI blips from a seed."
tags: [audio-cues, positive]
runs: 3
execution:
  prompt: >-
    Plan the sounds of my Godot arena game: a click and a confirm blip for the menu, three hit variations and a looping arena bed, each on the right bus. Render the menu sounds procedurally so they are reproducible, and tell me their peak and loudness.
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?audio-cues"'
