schema_version: "1.1"
name: bot-negative-1
description: "Near-miss: a settings menu walkthrough belongs to godot-playtest."
tags: [godot-bot, negative]
runs: 3
execution:
  prompt: >-
    Have an agent click through the settings menu of my Godot game like a new player would and report anything confusing.
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Skill]
graders:
  - name: skill-silent
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?godot-bot"'
    min: 0
    max: 0
    arm: both
  - name: owner-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?godot-playtest"'
