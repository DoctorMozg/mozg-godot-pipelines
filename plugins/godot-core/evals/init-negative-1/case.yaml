schema_version: "1.1"
name: init-negative-1
description: "Near-miss: a gate on one change belongs to godot-verify."
tags: [godot-init, negative]
runs: 3
execution:
  prompt: >-
    My Godot project is already set up with godotkit. Run the gate on my change and give me the receipt before I commit.
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Skill]
graders:
  - name: skill-silent
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?godot-init"'
    min: 0
    max: 0
    arm: both
  - name: owner-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?godot-verify"'
