schema_version: "1.1"
name: init-positive-1
description: "Literal: set up the checks on an existing project."
tags: [godot-init, positive]
runs: 3
execution:
  prompt: >-
    Set up the godotkit checks, a baseline and the hooks on my existing Godot project in ./game.
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?godot-init"'
