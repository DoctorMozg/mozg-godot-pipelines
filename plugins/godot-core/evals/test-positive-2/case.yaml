schema_version: "1.1"
name: test-positive-2
description: "Held-out phrasing: a failing test entry to diagnose."
tags: [godot-test, positive]
runs: 3
execution:
  prompt: >-
    tests/save_file_test.gd in my Godot project started failing with engine_error this morning. Find out why and make it pass properly.
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?godot-test"'
