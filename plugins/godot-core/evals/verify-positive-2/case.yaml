schema_version: "1.1"
name: verify-positive-2
description: "Held-out phrasing: is it safe to commit, prove it."
tags: [godot-verify, positive]
runs: 3
execution:
  prompt: >-
    I am about to commit my edits to the inventory screen of my Godot 4 game. Is it safe? Run whatever proves it still works.
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?godot-verify"'
