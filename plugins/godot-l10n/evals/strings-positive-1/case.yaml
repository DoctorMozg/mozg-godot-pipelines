schema_version: "1.1"
name: strings-positive-1
description: "Literal: add new UI text so it can be translated."
tags: [l10n-strings, positive]
runs: 3
execution:
  prompt: >-
    I'm adding a pause menu with Resume, Settings and Quit buttons. Add the button texts to our localization so they get translated later.
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?l10n-strings"'
