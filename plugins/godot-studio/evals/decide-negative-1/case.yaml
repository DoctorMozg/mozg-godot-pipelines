schema_version: "1.1"
name: decide-negative-1
description: "Near-miss: building a decided design in parallel belongs to studio-lanes."
tags: [studio-decide, negative]
runs: 3
execution:
  prompt: >-
    The save system decision for my Godot game is made and recorded as 003. Now get the save tasks built in parallel by several agents in separate worktrees and merge them.
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Skill]
graders:
  - name: skill-silent
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?studio-decide"'
    min: 0
    max: 0
    arm: both
  - name: owner-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?studio-lanes"'
