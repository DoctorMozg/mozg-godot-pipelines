schema_version: "1.1"
name: build-positive-1
description: "Literal: build a briefed screen and capture it."
tags: [ui-build, positive]
runs: 3
execution:
  prompt: >-
    The pause menu brief in my Godot project is approved. Build the pause menu scene from it, check the layout at 1280x720 and 1920x1080 and capture it into the review hub.
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?ui-build"'
